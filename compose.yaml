services:
  obstacle_detection:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: obstacle_detection

    stdin_open: true
    tty: true

    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=28
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,compute
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-ros

    volumes:
      - ./src:/home/ros/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./bags:/home/ros/ros2_ws/bags
      - ./docker/entrypoint.sh:/home/ros/entrypoint.sh
      - ./docker/utils.sh:/home/ros/utils.sh
      - /dev/dri:/dev/dri
    runtime: nvidia

    command: bash
